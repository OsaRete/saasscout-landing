name: Beta membership access
on:
  pull_request:
    paths:
      - '.github/workflows/beta-membership-access.yml'
      - 'app/api/**'
      - 'app/admin/**'
      - 'app/discover/**'
      - 'app/scan/**'
      - 'app/weekly/**'
      - 'tests/open-beta*'
      - 'scripts/open-beta-*'
      - 'app/layout.tsx'
      - 'lib/auth/**'
      - 'lib/spending/**'
      - 'lib/scan/**'
      - 'lib/weekly*'
      - 'lib/evidence/sources/**'
      - 'lib/intelligence/discover-opportunities-workflow.ts'
      - 'tests/provider-spending*'
      - 'tests/discovery-external-sources.test.ts'
      - 'components/beta-workspace-access.tsx'
      - 'lib/validation/server/**'
      - 'scripts/beta-membership-*'
      - 'supabase/migrations/**'
      - 'tests/beta-membership*'
      - 'tests/support/validation-module.ts'
      - 'tests/support/beta-acceptance-egress.mjs'
      - 'tests/support/beta-acceptance-provider.mjs'
      - 'tests/scan-artifact-fixture.ts'
      - 'e2e/beta-disposable-scan.spec.ts'
      - 'e2e/beta-disposable-discovery.spec.ts'
      - 'e2e/beta-disposable-survey.spec.ts'
      - 'e2e/beta-disposable-validation.spec.ts'
      - 'e2e/beta-disposable-weekly.spec.ts'
      - 'app/validation/**'
      - 'e2e/beta-disposable-account.spec.ts'
      - 'scripts/beta-acceptance-browser.mjs'
      - 'app/login/**'
      - 'app/update-password/**'
      - 'app/dashboard/**'
      - 'app/founder-profile/**'
      - 'app/opportunity/**'
      - 'app/saved/**'
      - 'app/scan/**'
      - 'lib/user-actions.ts'
permissions:
  contents: read
jobs:
  membership:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BETA_MEMBERSHIP_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set isolated fixture directory
        run: printf 'BETA_MEMBERSHIP_LOCAL_WORKDIR=%s/beta-membership-local\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Focused admission and preservation tests
        run: >-
          node --loader ./tests/support/server-only-loader.mjs --test
          tests/open-beta.test.ts tests/beta-membership.test.ts tests/scan-acceptance.test.ts
          tests/scan-status-aware-acceptance.test.ts tests/provider-spending.test.ts
          tests/discovery-external-sources.test.ts tests/weekly-external-evidence.test.ts
          tests/weekly-intelligence-quality.test.ts tests/weekly-intelligence-consolidation.test.ts
          tests/discovery-weekly-owner-isolation.test.ts
          tests/validation-release-boundary.test.ts
      - name: Upgrade acceptance with real local Auth and PostgREST
        run: |
          node scripts/beta-membership-disposable.mjs upgrade
          node --loader ./tests/support/server-only-loader.mjs tests/open-beta-db.ts upgrade
          node --loader ./tests/support/server-only-loader.mjs tests/provider-spending-db.ts
      - name: Fresh-install acceptance
        run: |
          node scripts/beta-membership-disposable.mjs fresh
          node --loader ./tests/support/server-only-loader.mjs tests/open-beta-db.ts fresh
          node --loader ./tests/support/server-only-loader.mjs tests/provider-spending-db.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real Auth browser and database acceptance
        run: node scripts/beta-acceptance-browser.mjs
      - name: Stop only labeled fixture containers
        if: always()
        run: node scripts/beta-membership-disposable.mjs stop
