name: Validation B3.1 Database
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start disposable local Supabase
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,kong,meta,realtime,rest,storage,studio,vector
      - name: Apply repository migrations to disposable database
        run: supabase db reset --local --no-seed
      - name: Execute B3.1 PostgreSQL contract
        env:
          B31_PROMOTION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          B31_PROMOTION_TEST_DISPOSABLE: I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
        run: npm run test:validation-b31-db
